<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GenLawyer — Crear Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#1B3A5C;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:#fff;border-radius:12px;padding:2rem;width:100%;max-width:420px;text-align:center}
h2{color:#1B3A5C;margin-bottom:8px}
p{color:#666;font-size:13px;margin-bottom:1.5rem}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1B3A5C;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
button:hover{opacity:.9}
#msg{margin-top:1rem;font-size:13px;min-height:20px}
.ok{color:#1D9E75;font-weight:600}
.err{color:#A32D2D}
</style>
</head>
<body>
<div class="box">
  <h2>GenLawyer</h2>
  <p>Configura tu perfil de Administrador</p>
  <input id="nombre" placeholder="Tu nombre completo" value="Carlos Castro Torres">
  <input id="email" placeholder="Tu correo electrónico">
  <input type="password" id="pass" placeholder="Tu contraseña de GenLawyer">
  <button onclick="crearAdmin()">Crear perfil de Administrador</button>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey:"AIzaSyDZUkncJxT1--o1plS7QxOcmuY_Z_DyGgE",
  authDomain:"genlawyer-cbb14.firebaseapp.com",
  databaseURL:"https://genlawyer-cbb14-default-rtdb.firebaseio.com",
  projectId:"genlawyer-cbb14",
  storageBucket:"genlawyer-cbb14.firebasestorage.app",
  messagingSenderId:"733984938185",
  appId:"1:733984938185:web:cf3613c5c33d7074e6d518"
});

const db = getDatabase(app);
const auth = getAuth(app);

window.crearAdmin = async function() {
  const nombre = document.getElementById('nombre').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const msg = document.getElementById('msg');

  if(!nombre || !email || !pass) {
    msg.className='err'; msg.textContent='Completa todos los campos.'; return;
  }

  msg.className=''; msg.textContent='Verificando credenciales...';

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    msg.textContent='Creando perfil de administrador...';

    await set(ref(db, 'usuarios/' + uid), {
      nombre: nombre,
      email: email,
      rol: 'admin',
      creadoEn: new Date().toISOString().split('T')[0]
    });

    msg.className='ok';
    msg.innerHTML='✓ Perfil de administrador creado correctamente.<br><br><strong>Ya puedes cerrar esta página y entrar al sistema GenLawyer.</strong>';
    document.querySelector('button').disabled = true;

  } catch(e) {
    const msgs = {
      'auth/wrong-password':'Contraseña incorrecta.',
      'auth/invalid-credential':'Correo o contraseña incorrectos.',
      'auth/user-not-found':'Usuario no encontrado.',
      'auth/invalid-email':'Correo inválido.'
    };
    msg.className='err';
    msg.textContent = msgs[e.code] || 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
