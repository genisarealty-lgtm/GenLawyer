<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenLawyer — Sistema de Procesos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#185FA5;--azul-claro:#E6F1FB;--verde:#1D9E75;--verde-claro:#E1F5EE;--rojo:#A32D2D;--rojo-claro:#FCEBEB;--amarillo:#854F0B;--amarillo-claro:#FAEEDA;--gris:#5F5E5A;--gris-claro:#F1EFE8;--borde:#e2e2e0;--radio:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f5f5f3;color:#1a1a18;font-size:14px}
header{background:#fff;border-bottom:1px solid var(--borde);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{font-size:16px;font-weight:600;color:var(--azul)}
.logo span{font-weight:400;color:var(--gris);font-size:13px;margin-left:8px}
.header-actions{display:flex;gap:8px;align-items:center}
.main{padding:16px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:var(--radio);padding:12px 14px;border:1px solid var(--borde)}
.stat-label{font-size:11px;color:var(--gris);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600}
.stat-val.rojo{color:var(--rojo)}
.stat-val.amarillo{color:var(--amarillo)}
.stat-val.verde{color:var(--verde)}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
input[type=text],select{font-size:13px;padding:7px 10px;border-radius:var(--radio);border:1px solid var(--borde);background:#fff;color:#1a1a18;font-family:inherit;outline:none}
input[type=text]:focus,select:focus{border-color:var(--azul)}
input[type=text]{width:220px}
btn,button{font-family:inherit;font-size:13px;padding:7px 14px;border-radius:var(--radio);border:1px solid var(--borde);background:#fff;color:#1a1a18;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:#f5f5f3}
button.primary{background:var(--azul);color:#fff;border-color:var(--azul)}
button.primary:hover{opacity:.9}
button.success{background:var(--verde);color:#fff;border-color:var(--verde)}
button.danger{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.table-wrap{background:#fff;border-radius:var(--radio);border:1px solid var(--borde);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#f9f9f7;padding:10px 12px;text-align:left;font-weight:500;font-size:12px;color:var(--gris);border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f0ee;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.badge.rojo{background:var(--rojo-claro);color:var(--rojo)}
.badge.amarillo{background:var(--amarillo-claro);color:var(--amarillo)}
.badge.verde{background:var(--verde-claro);color:var(--verde)}
.badge.gris{background:var(--gris-claro);color:var(--gris)}
.badge.azul{background:var(--azul-claro);color:var(--azul)}
.juzgado-activo{font-weight:500;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radicado{font-family:monospace;font-size:11px;color:var(--gris)}
.partes{font-size:12px;font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partes-sub{font-size:11px;color:var(--gris);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accion-btn{padding:4px 8px;font-size:11px;gap:4px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;border:1px solid var(--borde);padding:1.5rem;width:100%;max-width:560px;position:relative}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem}
.close-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--gris);padding:0}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--gris);margin-bottom:4px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:13px;padding:8px 10px;border-radius:var(--radio);border:1px solid var(--borde);font-family:inherit;background:#fff;color:#1a1a18}
.form-row textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--borde)}
.hist-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ee}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:10px;height:10px;border-radius:50%;background:var(--borde);margin-top:4px;flex-shrink:0}
.hist-dot.activo{background:var(--verde)}
.hist-text{font-size:13px}
.hist-sub{font-size:11px;color:var(--gris)}
.alerta-box{background:var(--amarillo-claro);border:1px solid #EF9F27;border-radius:var(--radio);padding:10px 12px;font-size:12px;color:var(--amarillo);margin-bottom:12px}
.empty{text-align:center;padding:3rem;color:var(--gris)}
.sync-indicator{font-size:11px;color:var(--gris);display:flex;align-items:center;gap:4px}
.dot-sync{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block}
.dot-sync.online{background:var(--verde)}
.dot-sync.saving{background:var(--amarillo)}
.toast{position:fixed;bottom:20px;right:20px;background:#1a1a18;color:#fff;padding:10px 16px;border-radius:var(--radio);font-size:13px;z-index:999;display:none;max-width:300px}
.seccion-titulo{font-size:11px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;background:#f9f9f7;border-bottom:1px solid var(--borde)}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  input[type=text]{width:100%}
  .main{padding:10px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">GenLawyer <span>Sistema de Procesos</span></div>
  </div>
  <div class="header-actions">
    <div class="sync-indicator"><span class="dot-sync" id="sync-dot"></span><span id="sync-label">Conectando...</span></div>
    <button class="primary" onclick="abrirNuevo()">+ Nuevo proceso</button>
  </div>
</header>

<div class="main">
  <div class="stats" id="stats-bar"></div>

  <div class="filters">
    <input type="text" id="busq" placeholder="Radicado, partes, juzgado..." oninput="renderTabla()">
    <select id="f-etapa" onchange="renderTabla()">
      <option value="">Todas las etapas</option>
      <option>Primera instancia</option>
      <option>Apelación</option>
      <option>Ejecución</option>
      <option>Casación</option>
      <option>Conciliación</option>
    </select>
    <select id="f-tipo" onchange="renderTabla()">
      <option value="">Todos los tipos</option>
      <option>Civil</option>
      <option>Laboral</option>
      <option>Familia</option>
      <option>Constitucional</option>
      <option>Administrativo</option>
    </select>
    <select id="f-sem" onchange="renderTabla()">
      <option value="">Todos los estados</option>
      <option value="rojo">Urgente</option>
      <option value="amarillo">Próximo</option>
      <option value="verde">Al día</option>
      <option value="gris">Sin fecha</option>
    </select>
    <select id="f-resp" onchange="renderTabla()">
      <option value="">Todos los responsables</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:120px">Radicado</th>
          <th style="width:160px">Partes</th>
          <th style="width:190px">Juzgado activo</th>
          <th style="width:100px">Etapa</th>
          <th style="width:110px">Próx. término</th>
          <th style="width:75px">Estado</th>
          <th style="width:90px">Responsable</th>
          <th style="width:90px">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal nuevo/editar -->
<div class="overlay" id="modal-proc">
  <div class="modal">
    <button class="close-btn" onclick="cerrar('modal-proc')">×</button>
    <h3 id="modal-proc-titulo">Registrar proceso</h3>
    <div class="form-grid">
      <div class="form-row"><label>Radicado</label><input id="f-radicado" placeholder="2025-00190-00"></div>
      <div class="form-row"><label>Tipo</label>
        <select id="f-tipo2"><option>Civil</option><option>Laboral</option><option>Familia</option><option>Constitucional</option><option>Administrativo</option></select>
      </div>
    </div>
    <div class="form-row"><label>Demandante</label><input id="f-demandante" placeholder="Nombre o razón social"></div>
    <div class="form-row"><label>Demandado</label><input id="f-demandado" placeholder="Nombre o razón social"></div>
    <div class="form-row"><label>Juzgado activo (competencia HOY)</label><input id="f-juzgado" placeholder="Juzgado 01 Civil del Circuito de..."></div>
    <div class="form-grid">
      <div class="form-row"><label>Etapa actual</label>
        <select id="f-etapa2"><option>Primera instancia</option><option>Apelación</option><option>Ejecución</option><option>Casación</option><option>Conciliación</option></select>
      </div>
      <div class="form-row"><label>Responsable</label><input id="f-resp2" placeholder="Abogado asignado"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Próximo término</label><input type="date" id="f-termino"></div>
      <div class="form-row"><label>Descripción del término</label><input id="f-termino-desc" placeholder="Ej: Traslado del recurso"></div>
    </div>
    <div class="form-row"><label>Observaciones</label><textarea id="f-obs" placeholder="Notas relevantes..."></textarea></div>
    <div class="modal-footer">
      <button onclick="cerrar('modal-proc')">Cancelar</button>
      <button class="primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal detalle -->
<div class="overlay" id="modal-det">
  <div class="modal" style="max-width:600px">
    <button class="close-btn" onclick="cerrar('modal-det')">×</button>
    <div id="det-contenido"></div>
  </div>
</div>

<!-- Modal cambio etapa -->
<div class="overlay" id="modal-etapa">
  <div class="modal" style="max-width:420px">
    <button class="close-btn" onclick="cerrar('modal-etapa')">×</button>
    <h3>Cambiar etapa / juzgado</h3>
    <p style="font-size:12px;color:var(--gris);margin-bottom:1rem">El juzgado anterior queda en el historial automáticamente.</p>
    <div class="form-row"><label>Nueva etapa</label>
      <select id="e-etapa"><option>Primera instancia</option><option>Apelación</option><option>Ejecución</option><option>Casación</option><option>Conciliación</option></select>
    </div>
    <div class="form-row"><label>Nuevo juzgado competente</label><input id="e-juzgado" placeholder="Tribunal / Juzgado que asume"></div>
    <div class="form-row"><label>Motivo del cambio</label><input id="e-motivo" placeholder="Ej: Recurso de apelación admitido"></div>
    <div class="modal-footer">
      <button onclick="cerrar('modal-etapa')">Cancelar</button>
      <button class="primary" onclick="confirmarEtapa()">Confirmar</button>
    </div>
  </div>
</div>

let procesos = {};
let editandoId = null;
let cambiandoEtapaId = null;

function setSyncState(state) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (state === 'online') { dot.className='dot-sync online'; lbl.textContent='Sincronizado'; }
  else if (state === 'saving') { dot.className='dot-sync saving'; lbl.textContent='Guardando...'; }
  else { dot.className='dot-sync'; lbl.textContent='Sin conexión'; }
}

function mostrarToast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(() => t.style.display='none', ms);
}

onValue(procesosRef, snap => {
  const val = snap.val();
  if (val) {
    procesos = val;
    setSyncState('online');
  } else {
    // Primera vez: cargar datos iniciales
    setSyncState('saving');
    const batch = {};
    DATOS_INICIALES.forEach(p => {
      const key = 'p' + Date.now() + Math.floor(Math.random()*100000);
      batch[key] = p;
    });
    set(procesosRef, batch).then(() => setSyncState('online'));
  }
  renderStats();
  renderTabla();
  actualizarFiltroResp();
}, err => { setSyncState('offline'); console.error(err); });

function semaforo(termino) {
  if (!termino) return 'gris';
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const t = new Date(termino + 'T00:00:00');
  const d = Math.round((t-hoy)/86400000);
  if (d < 0) return 'rojo';
  if (d <= 7) return 'rojo';
  if (d <= 20) return 'amarillo';
  return 'verde';
}

function semLabel(s) { return {rojo:'Urgente',amarillo:'Próximo',verde:'Al día',gris:'Sin fecha'}[s]||'Sin fecha'; }

function diasLabel(t) {
  if (!t) return '—';
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(t+'T00:00:00');
  const d = Math.round((f-hoy)/86400000);
  if (d<0) return `Venció hace ${Math.abs(d)}d`;
  if (d===0) return 'Hoy';
  return `En ${d}d`;
}

function renderStats() {
  const lista = Object.values(procesos);
  const total = lista.length;
  const rojos = lista.filter(p=>semaforo(p.termino)==='rojo').length;
  const amarillos = lista.filter(p=>semaforo(p.termino)==='amarillo').length;
  const enApelacion = lista.filter(p=>p.etapa==='Apelación').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="stat-label">Total procesos</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-label">Urgentes (&lt;7d)</div><div class="stat-val rojo">${rojos}</div></div>
    <div class="stat"><div class="stat-label">Próximos (8-20d)</div><div class="stat-val amarillo">${amarillos}</div></div>
    <div class="stat"><div class="stat-label">En apelación</div><div class="stat-val azul">${enApelacion}</div></div>
    <div class="stat"><div class="stat-label">Al día / sin fecha</div><div class="stat-val verde">${total-rojos-amarillos}</div></div>
  `;
}

function actualizarFiltroResp() {
  const sel = document.getElementById('f-resp');
  const val = sel.value;
  const resps = [...new Set(Object.values(procesos).map(p=>p.responsable).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos los responsables</option>' + resps.map(r=>`<option${r===val?' selected':''}>${esc(r)}</option>`).join('');
}

window.renderTabla = function() {
  const busq = document.getElementById('busq').value.toLowerCase();
  const fEtapa = document.getElementById('f-etapa').value;
  const fTipo = document.getElementById('f-tipo').value;
  const fSem = document.getElementById('f-sem').value;
  const fResp = document.getElementById('f-resp').value;
  let lista = Object.entries(procesos).map(([k,v])=>({...v,_key:k})).filter(p=>{
    const txt=[p.radicado,p.demandante,p.demandado,p.juzgadoActivo,p.responsable].join(' ').toLowerCase();
    if(busq&&!txt.includes(busq)) return false;
    if(fEtapa&&p.etapa!==fEtapa) return false;
    if(fTipo&&p.tipo!==fTipo) return false;
    if(fSem&&semaforo(p.termino)!==fSem) return false;
    if(fResp&&p.responsable!==fResp) return false;
    return true;
  });
  lista.sort((a,b)=>{const s={rojo:0,amarillo:1,verde:2,gris:3};return(s[semaforo(a.termino)]||3)-(s[semaforo(b.termino)]||3);});
  const tbody = document.getElementById('tabla-body');
  if(!lista.length){tbody.innerHTML=`<tr><td colspan="8" class="empty">Sin resultados</td></tr>`;return;}
  tbody.innerHTML = lista.map(p=>{
    const sem=semaforo(p.termino);
    return `<tr>
      <td><div class="radicado" title="${esc(p.radicado)}">${esc(p.radicado)}</div></td>
      <td><div class="partes">${esc(p.demandante||'—')}</div><div class="partes-sub">vs. ${esc(p.demandado||'—')}</div></td>
      <td><div class="juzgado-activo" title="${esc(p.juzgadoActivo)}">${esc(p.juzgadoActivo)}</div></td>
      <td><span class="badge gris">${esc(p.etapa||'—')}</span></td>
      <td><span style="font-size:12px">${diasLabel(p.termino)}</span>${p.terminoDesc?`<div style="font-size:11px;color:var(--gris)">${esc(p.terminoDesc)}</div>`:''}</td>
      <td><span class="badge ${sem}">${semLabel(sem)}</span></td>
      <td style="font-size:12px">${esc(p.responsable||'—')}</td>
      <td>
        <div style="display:flex;gap:4px">
          <button class="accion-btn" onclick="verDetalle('${p._key}')" title="Ver detalle">👁</button>
          <button class="accion-btn" onclick="abrirEtapa('${p._key}')" title="Cambiar etapa">⇅</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

window.abrirNuevo = function() {
  editandoId = null;
  document.getElementById('modal-proc-titulo').textContent = 'Registrar proceso';
  ['f-radicado','f-demandante','f-demandado','f-juzgado','f-resp2','f-termino','f-termino-desc','f-obs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('f-tipo2').value='Civil';
  document.getElementById('f-etapa2').value='Primera instancia';
  document.getElementById('modal-proc').classList.add('open');
}

  if(!radicado||!juzgado){alert('Radicado y juzgado activo son obligatorios.');return;}
  const etapa = document.getElementById('f-etapa2').value;
  const hoy = new Date().toISOString().split('T')[0];
  setSyncState('saving');
  if(editandoId) {
    const p = {...procesos[editandoId]};
    p.radicado=radicado; p.tipo=document.getElementById('f-tipo2').value;
    p.demandante=document.getElementById('f-demandante').value.trim();
    p.demandado=document.getElementById('f-demandado').value.trim();
    p.juzgadoActivo=juzgado; p.etapa=etapa;
    p.responsable=document.getElementById('f-resp2').value.trim();
    p.termino=document.getElementById('f-termino').value;
    p.terminoDesc=document.getElementById('f-termino-desc').value.trim();
    p.obs=document.getElementById('f-obs').value.trim();
    await set(ref(db,'procesos/'+editandoId), p);
    mostrarToast('Proceso actualizado');
  } else {
    const nuevo = {
      radicado, tipo:document.getElementById('f-tipo2').value,
      demandante:document.getElementById('f-demandante').value.trim(),
      demandado:document.getElementById('f-demandado').value.trim(),
      juzgadoActivo:juzgado, etapa,
      responsable:document.getElementById('f-resp2').value.trim(),
      termino:document.getElementById('f-termino').value,
      terminoDesc:document.getElementById('f-termino-desc').value.trim(),
      obs:document.getElementById('f-obs').value.trim(),
      historial:[{etapa,juzgado,fecha:hoy,motivo:'Registro manual'}]
    };
    await push(procesosRef, nuevo);
    mostrarToast('Proceso registrado');
  }
  cerrar('modal-proc');
  actualizarFiltroResp();
}

window.verDetalle = function(key) {
  const p = procesos[key];
  if(!p) return;
  const sem = semaforo(p.termino);
  const histHtml = (p.historial||[]).slice().reverse().map((h,i)=>`
    <div class="hist-item">
      <div class="hist-dot${i===0?' activo':''}"></div>
      <div>
        <div class="hist-text">${esc(h.etapa)} — <strong>${esc(h.juzgado)}</strong></div>
        <div class="hist-sub">${esc(h.fecha)} · ${esc(h.motivo||'')}</div>
      </div>
    </div>`).join('');
  document.getElementById('det-contenido').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:1rem">
      <div>
        <div style="font-family:monospace;font-size:12px;color:var(--gris);margin-bottom:2px">${esc(p.radicado)}</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:2px">${esc(p.demandante||'—')}</div>
        <div style="font-size:13px;color:var(--gris)">vs. ${esc(p.demandado||'—')}</div>
      </div>
      <span class="badge ${sem}" style="flex-shrink:0">${semLabel(sem)}</span>
    </div>
    <div style="background:#f9f9f7;border-radius:var(--radio);padding:12px;margin-bottom:1rem">
      <div style="font-size:11px;color:var(--gris);margin-bottom:4px">Juzgado activo (competencia actual)</div>
      <div style="font-size:15px;font-weight:600">${esc(p.juzgadoActivo)}</div>
      <div style="font-size:12px;color:var(--gris);margin-top:4px">Etapa: ${esc(p.etapa)} · Tipo: ${esc(p.tipo)}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;font-size:13px">
      <div><div style="font-size:11px;color:var(--gris)">Responsable</div>${esc(p.responsable||'—')}</div>
      <div><div style="font-size:11px;color:var(--gris)">Próximo término</div>${diasLabel(p.termino)}${p.terminoDesc?' · '+esc(p.terminoDesc):''}</div>
    </div>
    ${p.obs?`<div style="font-size:13px;color:var(--gris);padding:10px;background:#f9f9f7;border-radius:var(--radio);margin-bottom:1rem">${esc(p.obs)}</div>`:''}
    ${p.alerta?`<div class="alerta-box">⚠ ${esc(p.alerta)}</div>`:''}
    <div style="border-top:1px solid var(--borde);padding-top:1rem">
      <div style="font-size:12px;font-weight:500;color:var(--gris);margin-bottom:8px">Historial de juzgados y etapas</div>
      ${histHtml||'<div style="font-size:13px;color:var(--gris)">Sin historial</div>'}
    </div>
    <div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="abrirEditar('${key}');cerrar('modal-det')">✏ Editar</button>
      <button onclick="abrirEtapa('${key}');cerrar('modal-det')">⇅ Cambiar etapa</button>
      <button class="danger" onclick="eliminar('${key}')">🗑 Eliminar</button>
    </div>`;
  document.getElementById('modal-det').classList.add('open');
}

window.abrirEditar = function(key) {
  const p = procesos[key];
  if(!p) return;
  editandoId = key;
  document.getElementById('modal-proc-titulo').textContent = 'Editar proceso';
  document.getElementById('f-radicado').value = p.radicado||'';
  document.getElementById('f-tipo2').value = p.tipo||'Civil';
  document.getElementById('f-demandante').value = p.demandante||'';
  document.getElementById('f-demandado').value = p.demandado||'';
  document.getElementById('f-juzgado').value = p.juzgadoActivo||'';
  document.getElementById('f-etapa2').value = p.etapa||'Primera instancia';
  document.getElementById('f-resp2').value = p.responsable||'';
  document.getElementById('f-termino').value = p.termino||'';
  document.getElementById('f-termino-desc').value = p.terminoDesc||'';
  document.getElementById('f-obs').value = p.obs||'';
  document.getElementById('modal-proc').classList.add('open');
}

window.abrirEtapa = function(key) {
  cambiandoEtapaId = key;
  const p = procesos[key];
  document.getElementById('e-etapa').value = p?p.etapa:'Primera instancia';
  document.getElementById('e-juzgado').value='';
  document.getElementById('e-motivo').value='';
  document.getElementById('modal-etapa').classList.add('open');
}

window.confirmarEtapa = async function() {
  const juzgado = document.getElementById('e-juzgado').value.trim();
  const etapa = document.getElementById('e-etapa').value;
  const motivo = document.getElementById('e-motivo').value.trim();
  if(!juzgado){alert('El nuevo juzgado es obligatorio.');return;}
  const p = {...procesos[cambiandoEtapaId]};
  const hoy = new Date().toISOString().split('T')[0];
  if(!p.historial) p.historial=[];
  p.historial.push({etapa,juzgado,fecha:hoy,motivo:motivo||'Cambio de etapa'});
  p.juzgadoActivo=juzgado; p.etapa=etapa;
  setSyncState('saving');
  await set(ref(db,'procesos/'+cambiandoEtapaId), p);
  mostrarToast('Etapa actualizada — historial registrado');
  cerrar('modal-etapa');
}

window.eliminar = async function(key) {
  if(!confirm('¿Eliminar este proceso? Esta acción no se puede deshacer.')) return;
  setSyncState('saving');
  await remove(ref(db,'procesos/'+key));
  mostrarToast('Proceso eliminado');
  cerrar('modal-det');
}

window.cerrar = function(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
